[package]
name = "remora-bridge"
description = "User-side bridge for Remora relay mode (ADR-0021): holds the bridge static identity, the paired-device roster, and mints client pairing files; runs the end-to-end Noise session with clients through the blind relay"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
async-trait = { workspace = true }
base64 = { workspace = true }
blake2 = { workspace = true }
futures-util = { workspace = true }
rand = { workspace = true }
remora-core = { workspace = true }
remora-protocol = { workspace = true }
rustix = { workspace = true, features = ["fs", "process"] }
serde = { workspace = true }
serde_json = { workspace = true }
snow = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "sync", "macros", "time", "io-util", "io-std", "signal"] }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
tokio-util = { workspace = true }
toml = { workspace = true, features = ["display"] }

[dev-dependencies]
remora-relay = { path = "../remora-relay" }
tempfile = { workspace = true }
# `test-util` enables paused-time tests (`start_paused`) for the timeout seams.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
