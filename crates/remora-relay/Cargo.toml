[package]
name = "remora-relay"
description = "Blind envelope-frame relay for Remora relay mode (ADR-0021): routes opaque frames between authenticated WebSocket connections without ever depending on crypto or session-content crates"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
futures-util = { workspace = true }
remora-protocol = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "sync", "macros", "time", "io-util"] }
tokio-tungstenite = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
