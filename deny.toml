# cargo-deny configuration — https://embarkstudios.github.io/cargo-deny/
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Only fail on unmaintained crates we depend on directly. Tauri's Linux stack
# transitively pulls unmaintained crates (gtk-rs GTK3 bindings, unic) with no
# safe upgrade; that is upstream's to fix, and this heals automatically when
# tauri moves off them.
unmaintained = "workspace"
# quick-xml 0.39.4 (transitive: wayland-scanner build-time protocol XML, zbus
# D-Bus introspection — never attacker-controlled input here). Both advisories
# are DoS-class and no patched release exists yet; cargo update finds nothing
# newer. Temporary — remove when a fixed quick-xml lands (see #244).
ignore = [
  { id = "RUSTSEC-2026-0194", reason = "no patched quick-xml yet; trusted-input surfaces only (see #244)" },
  { id = "RUSTSEC-2026-0195", reason = "no patched quick-xml yet; trusted-input surfaces only (see #244)" },
]

[licenses]
version = 2
allow = [
  "AGPL-3.0-only",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
