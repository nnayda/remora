# cargo-deny configuration — https://embarkstudios.github.io/cargo-deny/
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Only fail on unmaintained crates we depend on directly. Tauri's Linux stack
# transitively pulls unmaintained crates (gtk-rs GTK3 bindings, unic) with no
# safe upgrade; that is upstream's to fix, and this heals automatically when
# tauri moves off them.
unmaintained = "workspace"
# quick-xml 0.39.4 advisories, fixed only in >= 0.41.0, which nothing in the
# Tauri Linux stack accepts yet (plist ^1 pins 0.39; no 0.39.x patch exists).
# The affected parsers only see local plist/wayland data here, not untrusted
# XML. Temporary — remove once `cargo update` reaches quick-xml >= 0.41
# through upstream; see #243.
ignore = [
  "RUSTSEC-2026-0194",
  "RUSTSEC-2026-0195",
]

[licenses]
version = 2
allow = [
  "AGPL-3.0-only",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  # webpki-roots ships the Mozilla CA root bundle as data under CDLA-Permissive-2.0
  # (a permissive data license). Pulled via tokio-tungstenite's
  # `rustls-tls-webpki-roots` feature so the relay bridge/client can dial `wss://`
  # relays (ADR-0021, #231). Data-only, permissive, compatible with AGPL.
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
