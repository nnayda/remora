[package]
name = "remora-desktop"
description = "Remora desktop app — Tauri shell"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
# The `_lib` suffix avoids a name collision with the binary on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "remora_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
remora-core = { workspace = true }
remora-protocol = { workspace = true }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.22", features = ["derive", "serde"] }
specta-typescript = "=0.0.9"
tokio = { workspace = true, features = ["sync", "macros", "rt", "time"] }
notify = "8"
notify-debouncer-full = "0.5"

[dev-dependencies]
async-trait = { workspace = true }

[lints]
workspace = true
