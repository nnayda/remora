version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  # Keeps the relay image's pinned base-image digests
  # (crates/remora-relay/Dockerfile: rust:1-bookworm, distroless/cc-debian12)
  # current as upstream patches them — the digest-refresh cadence for #251's
  # reproducible build. Bumps the sha256 pin while holding the tag; the weekly
  # relay-reproducible.yml run re-verifies reproducibility after each bump.
  - package-ecosystem: docker
    directory: /crates/remora-relay
    schedule:
      interval: weekly
    commit-message:
      prefix: chore

  # Keeps the bridge image's pinned base-image digests
  # (crates/remora-bridge/Dockerfile: rust:1-bookworm, debian:bookworm-slim)
  # current as upstream patches them — the digest-refresh cadence for #234's
  # reproducible build. Bumps the sha256 pin while holding the tag; the weekly
  # bridge-reproducible.yml run re-verifies reproducibility after each bump.
  - package-ecosystem: docker
    directory: /crates/remora-bridge
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
