name: Bridge reproducible build

# Regression guard for the bridge image's bit-for-bit reproducibility
# (ADR-0021 / #234). The bridge binary is reproducible by construction — pinned
# base-image digests, `cargo build --release --locked`, and a single-codegen-
# unit, stripped release profile in a fixed build path — but that only holds as
# long as nobody introduces a non-deterministic input (a build-path-dependent
# codegen step, a profile change, lockfile drift). This job re-verifies it.
#
# Unlike the relay's distroless image, the bridge runtime is debian-slim plus
# an apt layer (openssh-client), so only the compiled BINARY is reproducible
# today — the image digest is not (see crates/remora-bridge/Dockerfile). This
# job checks the binary, which is the meaningful guarantee.
#
# Scheduled weekly rather than per-PR: reproducibility rarely regresses and a
# double image build is expensive, so this runs on a cadence that lines up with
# the weekly Dependabot base-image digest bumps (a bump is exactly when the
# inputs change). Trigger it by hand from the Actions tab when you need it
# sooner — e.g. right after merging a digest bump or a release-profile change.

on:
  schedule:
    - cron: "47 4 * * 1" # Mondays 04:47 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproducible:
    name: Bridge binary is bit-for-bit reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Builds the bridge image twice from a clean cache and asserts the two
      # extracted binaries share one sha256; exits non-zero on drift. Docker is
      # preinstalled on the GitHub-hosted runner.
      - name: Verify reproducible bridge binary
        run: ./scripts/verify-bridge-reproducible.sh
