[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "crates/remora-core",
  "crates/remora-protocol",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/nnayda/remora"
homepage = "https://github.com/nnayda/remora"
authors = ["Remora contributors"]

[workspace.dependencies]
async-trait = "0.1"
remora-core = { path = "crates/remora-core" }
remora-protocol = { path = "crates/remora-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", default-features = false }
toml = { version = "1", default-features = false, features = ["parse", "serde"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"

[profile.release]
codegen-units = 1
lto = true
strip = true
