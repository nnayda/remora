[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "crates/remora-bridge",
  "crates/remora-core",
  "crates/remora-protocol",
  "crates/remora-relay",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/nnayda/remora"
homepage = "https://github.com/nnayda/remora"
authors = ["Remora contributors"]

[workspace.dependencies]
async-trait = "0.1"
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
portable-pty = "0.9"
rand = "0.9"
remora-bridge = { path = "crates/remora-bridge" }
remora-core = { path = "crates/remora-core" }
remora-protocol = { path = "crates/remora-protocol" }
remora-relay = { path = "crates/remora-relay" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "2.0"
# snow >= 0.9.5 pulls in the GHSA-97f8-h76h-f297 fix; never pin below 0.9.5.
snow = "0.9.6"
subtle = "2"
tempfile = "3.27.0"
thiserror = "2"
tokio = { version = "1", default-features = false }
tokio-tungstenite = "0.29"
tokio-util = "0.7"
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
toml_edit = "0.25.12"
unicode-general-category = "1"
unicode-segmentation = "1"
# `no_std` is what makes vte's OSC buffer a bounded ArrayVec<1024> (the DoS
# bound ADR-0013 relies on); it is vte's default today, but pin it explicitly
# so a future `default-features = false` can't silently turn osc_raw into an
# unbounded Vec.
vte = { version = "0.13", features = ["no_std"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"

[profile.release]
codegen-units = 1
lto = true
strip = true
